name: Günlük Haber Güncelleme
on:
 schedule:
   - cron: '0 3 * * *'   # 03:00 UTC = 06:00 Türkiye
 workflow_dispatch:        # İstediğin zaman manuel de çalıştırabilirsin
jobs:
 update:
   runs-on: ubuntu-latest
   permissions:
     contents: write
   steps:
     - name: Kodu çek
       uses: actions/checkout@v4
     - name: Python 3.11 kur
       uses: actions/setup-python@v5
       with:
         python-version: '3.11'
     - name: Haberleri güncelle
       env:
         GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
       run: python scripts/update_news.py
     - name: App.jsx'e yaz
       run: python scripts/inject_news.py
     - name: Commit ve push
       run: |
         git config user.name "AutoBot"
         git config user.email "auto@bot.com"
         git add src/App.jsx
         git diff --staged --quiet || git commit -m "Otomatik guncelleme $(date +%Y-%m-%d)"
         git push
